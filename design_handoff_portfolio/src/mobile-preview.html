<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px 40px;background:oklch(0.235 0.014 135);font-family:'Azeret Mono',ui-monospace,monospace;color:oklch(0.86 0.012 84)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  button{padding:9px 14px;min-height:38px;border:1px solid oklch(0.98 0.02 80 / .22);background:transparent;color:oklch(0.86 0.012 84);font:inherit;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer}
  button[aria-pressed="true"]{border-color:oklch(0.845 0.070 145);color:oklch(0.93 0.06 142);background:oklch(0.845 0.07 145 / .12)}
  iframe{border:0;max-width:100%;background:oklch(0.966 0.012 88);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<iframe id="fr" src="Harsha Kalbalia - Portfolio.dc.html" title="Portfolio preview" style="width:390px;height:844px"></iframe>
<script>
  var SIZES = [[360,780,"360 · small android"],[390,844,"390 · iphone"],[412,915,"412 · large android"],[390,667,"390 · short"],[412,640,"412 · shortest"],[768,1024,"768 · ipad portrait"],[1024,768,"1024 · landscape"]];
  var bar = document.getElementById("bar"), fr = document.getElementById("fr"), active = 1;
  function render(){
    bar.innerHTML = "";
    SIZES.forEach(function(s, i){
      var b = document.createElement("button");
      b.textContent = s[2];
      b.setAttribute("aria-pressed", i === active ? "true" : "false");
      b.onclick = function(){ active = i; fr.style.width = s[0] + "px"; fr.style.height = s[1] + "px"; render(); };
      bar.appendChild(b);
    });
  }
  render();
</script>
</body>
</html>
